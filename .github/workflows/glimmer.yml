name: Glimmer Android

on:
  push:
    paths:
      - 'glimmer/**'
      - '.github/workflows/glimmer.yml'
  workflow_dispatch:

concurrency:
  group: glimmer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: glimmer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unpack the family signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GLIMMER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/glimmer.jks"
            echo "GLIMMER_KEYSTORE_FILE=$RUNNER_TEMP/glimmer.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No GLIMMER_KEYSTORE_BASE64 secret, so this APK is signed with a throwaway key and cannot update an earlier install. See glimmer/README.md."
          fi

      - name: Build the release and preview APKs
        env:
          GLIMMER_KEYSTORE_PASSWORD: ${{ secrets.GLIMMER_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease assemblePreview

      - name: Check the app asks for no internet access
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo "::error::Glimmer must never request the INTERNET permission"
            exit 1
          fi

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "glimmer-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: glimmer-apk
          path: glimmer/glimmer-1.0.${{ github.run_number }}.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: glimmer-preview-apk
          path: glimmer/app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
          retention-days: 3

  preview:
    name: Emulator screenshots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: glimmer-preview-apk
          path: preview-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash glimmer/scripts/emulator-preview.sh preview-apk/app-preview.apk preview-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glimmer-screenshots
          path: preview-out
          if-no-files-found: warn
          retention-days: 14
